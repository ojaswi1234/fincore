<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html_head('Open Account')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center py-5">

<div class="container" style="max-width: 500px;">
    <div class="text-center mb-4">
        <i class="bi bi-bank2 text-primary" style="font-size: 3rem;"></i>
        <h2 class="fw-bold mt-2 text-dark">FinCore</h2>
        <p class="text-muted small">Open your simulated digital banking account</p>
    </div>

    <div class="card shadow-sm border-0 rounded-4 p-4">
        <div class="card-body">
            <h4 class="card-title fw-bold mb-3">Create Account</h4>

            <div th:if="${registrationError}" class="alert alert-danger py-2 small" role="alert">
                <i class="bi bi-exclamation-circle-fill me-1"></i> <span th:text="${registrationError}">Error</span>
            </div>

            <form th:action="@{/register}" th:object="${registrationDto}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Username</label>
                    <input type="text" class="form-control" th:field="*{username}" placeholder="Unique username" required>
                    <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger small mt-1"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Full Legal Name</label>
                    <input type="text" class="form-control" th:field="*{fullName}" placeholder="e.g. Robert Johnson" required>
                    <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-danger small mt-1"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Email Address</label>
                    <input type="email" class="form-control" th:field="*{email}" placeholder="name@domain.com" required>
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small mt-1"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Password</label>
                    <input type="password" class="form-control" th:field="*{password}" placeholder="At least 6 characters" required>
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger small mt-1"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Confirm Password</label>
                    <input type="password" class="form-control" th:field="*{confirmPassword}" placeholder="Repeat password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">Register & Provision Account</button>
            </form>

            <div class="text-center mt-3">
                <span class="small text-muted">Already registered? </span>
                <a th:href="@{/login}" class="small text-decoration-none fw-semibold">Sign In</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
