<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="html_head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - FinCore Banking'">FinCore Banking</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- FinCore Custom Stylesheet -->
    <link th:href="@{/css/fincore.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-fincore sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/dashboard}">
            <i class="bi bi-shield-check text-info fs-4"></i>
            <span>FinCore<span class="text-info fw-normal"> | Banking</span></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#fincoreNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="fincoreNavbar">
            <!-- Customer Links -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" sec:authorize="hasRole('CUSTOMER')">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-grid-1x2-fill me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/transfers}"><i class="bi bi-send-fill me-1"></i> Transfers</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/transactions}"><i class="bi bi-clock-history me-1"></i> History</a>
                </li>
            </ul>

            <!-- Admin Links -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" sec:authorize="hasRole('ADMIN')">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-1"></i> Operational Monitor</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/alerts}"><i class="bi bi-exclamation-triangle-fill me-1"></i> Fraud Alerts</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/audit}"><i class="bi bi-journal-text me-1"></i> Audit Trail</a>
                </li>
            </ul>

            <!-- User Status & WebSocket Indicator -->
            <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                <span id="ws-status-indicator" class="badge bg-secondary" title="Real-Time WebSocket Link">Connecting...</span>

                <div class="dropdown">
                    <button class="btn btn-outline-light btn-sm dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="name">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><span class="dropdown-item-text text-muted small" sec:authentication="name"></span></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Sign Out</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="scripts">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SockJS and STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <!-- FinCore Real-Time Script -->
    <script th:src="@{/js/fincore-realtime.js}"></script>
    <!-- Toast Container for STOMP events -->
    <div id="toast-container" class="toast-container"></div>
</div>

</body>
</html>
