spring.application.name=fincore-banking
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.fincore=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Session Security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m

# Financial Currency Setting
fincore.currency.default=INR
fincore.fraud.high-value-threshold=200000.00
fincore.fraud.velocity-time-window-seconds=60
fincore.fraud.velocity-max-transfers=3
