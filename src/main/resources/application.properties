spring.application.name=fincore-banking
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fincore_db}
spring.datasource.username=${DB_USERNAME:fincore_user}
spring.datasource.password=${DB_PASSWORD:fincore_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.fincore=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Session Security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m

# Financial Currency Setting
fincore.currency.default=INR
fincore.fraud.high-value-threshold=200000.00
fincore.fraud.velocity-time-window-seconds=60
fincore.fraud.velocity-max-transfers=3
