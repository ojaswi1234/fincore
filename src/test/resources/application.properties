spring.application.name=fincore-banking-test

# H2 in PostgreSQL Mode for Local Test Execution
spring.datasource.url=jdbc:h2:mem:fincoredb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway during unit/integration tests with H2 ddl-auto
spring.flyway.enabled=false

logging.level.com.fincore=INFO

fincore.currency.default=INR
fincore.fraud.high-value-threshold=200000.00
fincore.fraud.velocity-time-window-seconds=60
fincore.fraud.velocity-max-transfers=3
